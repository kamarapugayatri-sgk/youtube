<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My YouTube Clone</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { color: #ff0000; }
        .video-container { width: 80%; max-width: 800px; aspect-ratio: 16/9; background: #222; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <h1><span style="background-color: white; color: black; padding: 2px 6px; border-radius: 4px;">AWS</span> Video Player</h1>
    <div class="video-container">
        <iframe src="https://youtube.com" allowfullscreen></iframe>
    </div>
    <p>Deployed automatically via AWS CodePipeline</p>
</body>
</html>
